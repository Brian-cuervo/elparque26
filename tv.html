<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV EN VIVO | ElParque26</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --azul-sitio: #00c3ff;
            --negro-fondo: #0a0b10;
            --gris-panel: #1a1c23;
        }

        body {
            margin: 0;
            background-color: var(--negro-fondo);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 5%;
            background-color: rgba(10, 11, 16, 0.9);
            border-bottom: 1px solid #222;
        }
        .logo a { text-decoration: none; color: white; font-size: 1.5rem; font-weight: bold; }
        .logo span { color: var(--azul-sitio); }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* --- CONTENEDOR TV --- */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .tv-marco {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: black;
            border: 4px solid #333;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 195, 255, 0.1);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .badge-live {
            position: absolute;
            top: 15px;
            left: 15px;
            background: red;
            color: white;
            padding: 4px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 4px;
            z-index: 10;
            animation: blink 2s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- PANEL DE CANALES --- */
        .panel-canales {
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
            background: var(--gris-panel);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .guia-titulo {
            margin-top: 0;
            color: var(--azul-sitio);
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .lista-botones {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .btn-ch {
            background: #222;
            color: white;
            border: 2px solid #444;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-ch:hover, .btn-ch.active {
            background: var(--azul-sitio);
            color: black;
            border-color: var(--azul-sitio);
        }

        @media (max-width: 600px) {
            .tv-marco { border-radius: 0; border: none; }
            .main-container { padding: 10px 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html">EL<span>PARQUE26</span></a></div>
        <div class="nav-links"><a href="index.html">⬅ VOLVER</a></div>
    </nav>

    <div class="main-container">
        <div class="tv-marco">
            <div class="badge-live">🔴 EN VIVO</div>
            <video id="video" controls autoplay></video>
        </div>

        <div class="panel-canales">
            <h3 class="guia-titulo">📡 ZAPPING ELPARQUE26</h3>
            <div class="lista-botones">
                <button class="btn-ch active" onclick="playM3U8('https://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/6430336219f864000859546b/master.m3u8?appName=web&deviceType=web', this)">Cartoon Network</button>
                <button class="btn-ch" onclick="playM3U8('https://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/5f624976766432000787e9e8/master.m3u8?appName=web&deviceType=web', this)">Nick Clásico</button>
                <button class="btn-ch" onclick="playM3U8('https://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/5f1f0b09337b5800076a0864/master.m3u8?appName=web&deviceType=web', this)">Pluto Anime</button>
                <button class="btn-ch" onclick="playM3U8('https://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/5e6287f33966950007090b85/master.m3u8?appName=web&deviceType=web', this)">South Park</button>
            </div>
        </div>
    </div>

    <script>
        var video = document.getElementById('video');
        var hls = new Hls();

        function playM3U8(url, btn) {
            // Cambiar estado visual de botones
            document.querySelectorAll('.btn-ch').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (Hls.isSupported()) {
                hls.destroy(); // Limpiar el canal anterior
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        // Cargar el primer canal al abrir
        window.onload = function() {
            const firstBtn = document.querySelector('.btn-ch');
            playM3U8('https://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/6430336219f864000859546b/master.m3u8?appName=web&deviceType=web', firstBtn);
        };
    </script>

</body>
</html>
