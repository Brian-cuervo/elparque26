<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Show Más Latino | ElParque26</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0b10">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        /* Estilos del Menú Lateral (Sidebar) */
        .menu-lateral {
            height: 100%;
            width: 0; /* Arranca oculto */
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: #111;
            border-right: 2px solid var(--azul);
            overflow-x: hidden;
            transition: 0.4s;
            padding-top: 60px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.8);
        }

        .menu-lateral a, .boton-desplegable {
            padding: 15px 15px 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            color: #ccc;
            display: block;
            transition: 0.3s;
            font-family: sans-serif;
            font-weight: bold;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            outline: none;
        }

        .menu-lateral a:hover, .boton-desplegable:hover {
            color: #fff;
            background-color: #222;
        }

        /* El botón de la X para cerrar */
        .menu-lateral .boton-cerrar {
            position: absolute;
            top: 0;
            right: 15px;
            font-size: 36px;
            margin-left: 50px;
            padding: 10px;
            width: auto;
        }

        /* Estilo de la lista desplegable de DBZ */
        .submenu-lateral {
            display: none; /* Arranca cerrado */
            background-color: #0a0b10;
        }

        .submenu-lateral a {
            font-size: 1rem;
            padding-left: 50px; /* Un poco más a la derecha para que parezca submenú */
            color: #ff7f00; /* Naranja para identificar DBZ */
        }

        .submenu-lateral a:hover {
            color: #fff;
            background-color: #1a1a1a;
        }
    </style>
</head>
<body class="v-particles">

    <div id="miMenuLateral" class="menu-lateral">
        <a href="javascript:void(0)" class="boton-cerrar" onclick="cerrarMenu()">&times;</a>
        
        <a href="index.html" style="color: var(--azul);">Un Show Más</a>
        
        <button class="boton-desplegable" onclick="toggleSubMenu()">Dragon Ball Z <span style="float:right; margin-right:20px;">&#9660;</span></button>
        
        <div class="submenu-lateral" id="submenuDBZ">
            <a href="saga_saiyajin.html">🐉 Saga Saiyajin</a>
            </div>
    </div>

    <nav class="navbar">
        <div style="display: flex; align-items: center;">
            <span style="font-size:25px; cursor:pointer; color: var(--azul); margin-right: 15px;" onclick="abrirMenu()">&#9776;</span>
            
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">El<span>Parque26</span></a>
            </div>
        </div>
        <div class="nav-links">
            <a href="#buscador">Buscar</a>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1 id="main-title">Un Show Más</h1>
        </div>
    </header>

    <section class="characters-mini" style="margin-top: 20px; margin-bottom: 20px;">
        <div class="char-row">
            <div class="c-item" onclick="festejoMordo()"><img src="mordecai.png"></div>
            <div class="c-item" onclick="retoHuevo()"><img src="rigby.png"></div>
            <div class="c-item" onclick="enojarBenson()"><img src="benson.png"></div>
            <div class="c-item" onclick="sabiduriaSkips()"><img src="skips.png"></div>
            <div class="c-item" onclick="regaloPapaleta()"><img src="papaleta.png"></div>
            <div class="c-item" onclick="bromaMusculoso()"><img src="musculoso.png"></div>
        </div>
    </section>

    <div class="search-container" id="buscador">
        <input type="text" id="inputBuscador" onkeyup="buscarTemporada()" placeholder="🔍 ¿Qué temporada buscas?" class="search-input">
    </div>

    <section class="container">
        <h3 style="color: var(--azul); margin-bottom: 25px; text-align: center;">SELECCIONÁ UN TÍTULO</h3>
        
        <div class="poster-selector" style="justify-content: center; display: flex; flex-wrap: wrap; gap: 20px;">
            <a href="t1.html" class="poster-card" data-name="temporada 1">
                <img src="t1.png" alt="T1">
                <div class="poster-info">TEMPORADA 1</div>
            </a>
            <a href="t2.html" class="poster-card" data-name="temporada 2">
                <img src="t2.png" alt="T2">
                <div class="poster-info">TEMPORADA 2</div>
            </a>
            <a href="t3.html" class="poster-card" data-name="temporada 3">
                <img src="t3.png" alt="T3">
                <div class="poster-info">TEMPORADA 3</div>
            </a>
            <a href="t4.html" class="poster-card" data-name="temporada 4">
                <img src="t4.png" alt="T4">
                <div class="poster-info">TEMPORADA 4</div>
            </a>
            <a href="t5.html" class="poster-card" data-name="temporada 5">
                <img src="t5.png" alt="T5">
                <div class="poster-info">TEMPORADA 5</div>
            </a>
            <a href="t6.html" class="poster-card" data-name="temporada 6">
                <img src="t6.png" alt="T6">
                <div class="poster-info">TEMPORADA 6</div>
            </a>
            <a href="t7.html" class="poster-card" data-name="temporada 7">
                <img src="t7.png" alt="T7">
                <div class="poster-info">TEMPORADA 7</div>
            </a>
            <a href="t8.html" class="poster-card" data-name="temporada 8">
                <img src="t8.png" alt="T8">
                <div class="poster-info">TEMPORADA 8</div>
            </a>
            <a href="pelicula.html" class="poster-card" data-name="pelicula la pelicula">
                <img src="pelicula.png" alt="Pelicula">
                <div class="poster-info">LA PELÍCULA</div>
            </a>
        </div>
    </section>

    <footer style="text-align: center; padding: 40px; color: #444; font-size: 0.8rem;">
        ELPARQUE26 - 2026
    </footer>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('Service worker registrado con éxito.');
            }).catch(err => {
                console.warn('Error al registrar Service Worker:', err);
            });
        });
    }

    /* Funciones para abrir y cerrar el menú lateral */
    function abrirMenu() {
        document.getElementById("miMenuLateral").style.width = "250px";
    }

    function cerrarMenu() {
        document.getElementById("miMenuLateral").style.width = "0";
    }

    /* Función para desplegar/ocultar las sagas de DBZ */
    function toggleSubMenu() {
        let submenu = document.getElementById("submenuDBZ");
        if (submenu.style.display === "block") {
            submenu.style.display = "none";
        } else {
            submenu.style.display = "block";
        }
    }

    function buscarTemporada() {
        let input = document.getElementById('inputBuscador').value.toLowerCase();
        let posters = document.querySelectorAll('.poster-card');
        
        posters.forEach(p => {
            let nombre = p.getAttribute('data-name');
            if(nombre) {
                if (nombre.toLowerCase().includes(input)) {
                    p.style.display = "block";
                } else {
                    p.style.display = "none";
                }
            }
        });
    }

    function mostrarMensaje(texto, imagen = null) {
        const m = document.createElement(imagen ? "img" : "div");
        if (imagen) m.src = imagen; else m.innerText = texto;
        m.className = "efecto-pop";
        document.body.appendChild(m);
        setTimeout(() => m.remove(), 2500);
    }

    function enojarBenson() {
        const t = document.getElementById('main-title');
        document.body.style.backgroundColor = "#ff4757";
        t.innerText = "¡VUELVAN A TRABAJAR!";
        setTimeout(() => {
            document.body.style.backgroundColor = "#0a0b10"; 
            t.innerText = "Un Show Más"; 
        }, 2000);
    }

    function retoHuevo() {
        const t = document.getElementById('main-title');
        document.body.style.backgroundColor = "#ffd32a";
        t.innerText = "¡SÉ EXTRA HUEVO ORDINARIO!";
        mostrarMensaje(null, "gorra.png"); 
        setTimeout(() => {
            document.body.style.backgroundColor = "#0a0b10"; 
            t.innerText = "Un Show Más"; 
        }, 3000);
    }

    function festejoMordo() {
        const t = document.getElementById('main-title');
        document.body.style.backgroundColor = "#1e90ff";
        t.innerText = "¡OOOOOOOOOOH!";
        setTimeout(() => {
            document.body.style.backgroundColor = "#0a0b10"; 
            t.innerText = "Un Show Más"; 
        }, 1500);
    }

    function sabiduriaSkips() {
        const t = document.getElementById('main-title');
        document.body.style.filter = "grayscale(1)";
        t.innerText = "YA HE VISTO ESTO ANTES...";
        setTimeout(() => {
            document.body.style.filter = "none"; 
            t.innerText = "Un Show Más"; 
        }, 2500);
    }

    function regaloPapaleta() {
        const t = document.getElementById('main-title');
        document.body.style.backgroundColor = "#ff79ff";
        t.innerText = "¡QUÉ BUEN SHOW!";

        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                const paleta = document.createElement("div");
                paleta.className = "paleta-caida";
                paleta.innerText = "🍭";
                paleta.style.left = Math.random() * 100 + "vw";
                paleta.style.animationDuration = (Math.random() * 2 + 1) + "s";
                document.body.appendChild(paleta);
                setTimeout(() => paleta.remove(), 3000);
            }, i * 100);
        }

        setTimeout(() => {
            document.body.style.backgroundColor = "#0a0b10"; 
            t.innerText = "Un Show Más"; 
        }, 3000);
    }

    function bromaMusculoso() {
        const t = document.getElementById('main-title');
        document.body.classList.add("shake-effect");
        t.innerText = "¿SABEN QUIÉN MÁS?";
        mostrarMensaje("¡MI MAMI!"); 
        setTimeout(() => {
            t.innerText = "Un Show Más"; 
            document.body.classList.remove("shake-effect"); 
        }, 3500);
    }
    </script>
</body>
</html>
