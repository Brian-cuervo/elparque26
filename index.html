<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Show Más Latino | ElParque26</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos rápidos para el Neón y las Paletas (También podés pasarlos al CSS) */
        #main-title {
            color: #fff;
            text-shadow: 0 0 7px #fff, 0 0 10px #fff, 0 0 21px #fff, 0 0 42px var(--azul), 0 0 82px var(--azul);
            text-transform: uppercase;
            transition: 0.5s;
        }

        .paleta-caida {
            position: fixed;
            top: -50px;
            font-size: 2.5rem;
            z-index: 10001;
            pointer-events: none;
            animation: caerPaleta 3s linear forwards;
        }

        @keyframes caerPaleta {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body class="v-particles">
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">El<span>Parque26</span></a>
        </div>
        <div class="nav-links">
            <a href="#buscador">Buscar</a>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1 id="main-title">Un Show Más</h1>
        </div>
    </header>

    <div class="search-container" id="buscador">
        <input type="text" id="inputBuscador" onkeyup="buscarTemporada()" placeholder="🔍 ¿Qué temporada buscas?" class="search-input">
    </div>

    <section class="container">
        <h3 style="color: var(--azul); margin-bottom: 25px; text-align: center;">SELECCIONÁ UNA TEMPORADA</h3>
        
        <div class="poster-selector" style="justify-content: center;">
            <a href="t1.html" class="poster-card" data-name="temporada 1">
                <img src="t1.png" alt="T1">
                <div class="poster-info">TEMPORADA 1</div>
            </a>
            <a href="t2.html" class="poster-card" data-name="temporada 2">
                <img src="t2.png" alt="T2">
                <div class="poster-info">TEMPORADA 2</div>
            </a>
            <a href="t3.html" class="poster-card" data-name="temporada 3">
                <img src="t3.png" alt="T3">
                <div class="poster-info">TEMPORADA 3</div>
            </a>
        </div>
    </section>

    <section class="characters-mini" style="margin-top: 40px;">
        <div class="char-row">
            <div class="c-item" onclick="festejoMordo()"><img src="mordecai.png"></div>
            <div class="c-item" onclick="retoHuevo()"><img src="rigby.png"></div>
            <div class="c-item" onclick="enojarBenson()"><img src="benson.png"></div>
            <div class="c-item" onclick="sabiduriaSkips()"><img src="skips.png"></div>
            <div class="c-item" onclick="regaloPapaleta()"><img src="papaleta.png"></div>
            <div class="c-item" onclick="bromaMusculoso()"><img src="musculoso.png"></div>
        </div>
    </section>

    <footer style="text-align: center; padding: 40px; color: #444; font-size: 0.8rem;">
        ELPARQUE26 - 2026
    </footer>

    <script>
    // 🔍 BUSCADOR CORREGIDO: Filtra las tarjetas 'poster-card' por el atributo 'data-name'
    function buscarTemporada() {
        // Obtenemos el texto ingresado en el buscador y lo pasamos a minúsculas
        let input = document.getElementById('inputBuscador').value.toLowerCase();
        // Buscamos todas las tarjetas de temporada (los enlaces <a>)
        let posters = document.querySelectorAll('.poster-card');
        
        posters.forEach(p => {
            // Obtenemos el nombre guardado en data-name y lo pasamos a minúsculas
            let nombre = p.getAttribute('data-name').toLowerCase();
            // Mostramos ('block') si coincide, ocultamos ('none') si no
            if (nombre.includes(input)) {
                p.style.display = "block";
            } else {
                p.style.display = "none";
            }
        });
    }

    // 📩 FUNCIÓN PARA MOSTRAR MENSAJES POP-UP (TEXTO O IMÁGENES)
    function mostrarMensaje(texto, imagen = null) {
        const m = document.createElement(imagen ? "img" : "div");
        if (imagen) m.src = imagen; else m.innerText = texto;
        m.className = "efecto-pop";
        document.body.appendChild(m);
        // Borramos el pop-up después de 2.5 segundos
        setTimeout(() => m.remove(), 2500);
    }

    // 🔥 EFECTOS DE PERSONAJES: CORREGIDOS PARA QUE SOLO AFECTEN AL TÍTULO

    function enojarBenson() {
        const t = document.getElementById('main-title'); // Solo definimos 't' como el título
        document.body.style.backgroundColor = "#ff4757"; // Fondo rojo
        t.innerText = "¡VUELVAN A TRABAJAR!"; // Solo actualizamos el título
        mostrarMensaje("¡ESTÁN DESPEDIDOS!"); // Mostramos pop-up
        setTimeout(() => { // Reseteamos después de 2 segundos
            document.body.style.backgroundColor = "#0a0b10"; 
            t.innerText = "Un Show Más"; 
        }, 2000);
    }

    function retoHuevo() {
        const t = document.getElementById('main-title'); // Solo definimos 't' como el título
        document.body.style.backgroundColor = "#ffd32a"; // Fondo amarillo
        t.innerText = "¡SÉ EXTRA HUEVO ORDINARIO!"; // Solo actualizamos el título
        mostrarMensaje(null, "gorra.png"); // Mostramos pop-up con imagen de gorra
        setTimeout(() => { // Reseteamos después de 3 segundos
            document.body.style.backgroundColor = "#0a0b10"; 
            t.innerText = "Un Show Más"; 
        }, 3000);
    }

    function festejoMordo() {
        const t = document.getElementById('main-title'); // Solo definimos 't' como el título
        document.body.style.backgroundColor = "#1e90ff"; // Fondo azul
        t.innerText = "¡OOOOOOOOOOH!"; // Solo actualizamos el título
        mostrarMensaje("¡OOOOOOOOOOH!"); // Mostramos pop-up
        setTimeout(() => { // Reseteamos después de 1.5 segundos
            document.body.style.backgroundColor = "#0a0b10"; 
            t.innerText = "Un Show Más"; 
        }, 1500);
    }

    function sabiduriaSkips() {
        const t = document.getElementById('main-title'); // Solo definimos 't' as main-title
        document.body.style.filter = "grayscale(1)"; // Fondo gris
        t.innerText = "YA HE VISTO ESTO ANTES..."; // Solo actualizamos el título
        mostrarMensaje("Ya he visto esto antes..."); // Mostramos pop-up
        setTimeout(() => { // Reseteamos después de 2.5 segundos
            document.body.style.filter = "none"; 
            t.innerText = "Un Show Más"; 
        }, 2500);
    }

    // 🍭 PAPALETA CORREGIDO: LLUVIA DE DULCES REAL
    function regaloPapaleta() {
        const t = document.getElementById('main-title'); // Solo definimos 't' as main-title
        document.body.style.backgroundColor = "#ff79ff"; // Fondo rosa
        t.innerText = "¡QUÉ BUEN SHOW!"; // Solo actualizamos el título
        mostrarMensaje("¡Qué buen show!"); // Mostramos pop-up

        // Creamos la lluvia de dulces (20 paletas caen)
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                const paleta = document.createElement("div");
                paleta.className = "paleta-caida";
                paleta.innerText = "🍭";
                // Posición aleatoria
                paleta.style.left = Math.random() * 100 + "vw";
                // Velocidad aleatoria
                paleta.style.animationDuration = (Math.random() * 2 + 1) + "s";
                document.body.appendChild(paleta);
                
                // Limpiar dulces después de 3 segundos (después de que caen)
                setTimeout(() => paleta.remove(), 3000);
            }, i * 100);
        }

        setTimeout(() => { // Reseteamos después de 3 segundos
            document.body.style.backgroundColor = "#0a0b10"; 
            t.innerText = "Un Show Más"; 
        }, 3000);
    }

    function bromaMusculoso() {
        const t = document.getElementById('main-title'); // Solo definimos 't' as main-title
        document.body.classList.add("shake-effect"); // Tiembla el cuerpo
        t.innerText = "¿SABEN QUIÉN MÁS?"; // Solo actualizamos el título
        mostrarMensaje("¡MI MAMI!"); // Mostramos pop-up
        setTimeout(() => { // Reseteamos después de 3.5 segundos
            t.innerText = "Un Show Más"; 
            document.body.classList.remove("shake-effect"); 
        }, 3500);
    }
</script>

</body>
</html>
