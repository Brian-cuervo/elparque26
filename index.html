<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Show Más Latino | ElParque26</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="v-particles">

    <!-- NAV -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">El<span>Parque26</span></a>
        </div>

        <div class="nav-links">
            <a href="#buscador">Buscar</a>
        </div>
    </nav>

    <!-- HERO -->
    <header class="hero">
        <div class="hero-content">
            <h1 id="main-title">Un Show Más</h1>
            <p class="hero-sub">
                37 episodios • Comedia • Aventuras
            </p>
        </div>
    </header>

    <!-- BUSCADOR -->
    <div class="search-container" id="buscador">
        <input 
            type="text" 
            id="inputBuscador" 
            onkeyup="buscarTemporada()" 
            placeholder="🔍 ¿Qué temporada buscas?" 
            class="search-input"
        >
    </div>

    <!-- TEMPORADAS -->
    <section class="container">
        <h3 class="titulo-seccion">SELECCIONÁ UNA TEMPORADA</h3>
        
        <div class="poster-selector">

            <a href="t1.html" class="poster-card" data-name="temporada 1 t1">
                <img src="t1.png" alt="Temporada 1" loading="lazy">
                <div class="poster-info">▶ Ver Temporada 1</div>
            </a>

            <a href="t2.html" class="poster-card" data-name="temporada 2 t2">
                <img src="t2.png" alt="Temporada 2" loading="lazy">
                <div class="poster-info">▶ Ver Temporada 2</div>
            </a>

            <a href="t3.html" class="poster-card" data-name="temporada 3 t3">
                <img src="t3.png" alt="Temporada 3" loading="lazy">
                <div class="poster-info">▶ Ver Temporada 3</div>
            </a>

            <!-- LISTO PARA CUANDO AGREGUES T4 -->
            <!--
            <a href="t4.html" class="poster-card" data-name="temporada 4 t4">
                <img src="t4.png" alt="Temporada 4" loading="lazy">
                <div class="poster-info">▶ Ver Temporada 4</div>
            </a>
            -->

        </div>
    </section>

    <!-- PERSONAJES -->
    <section class="characters-mini">
        <div class="char-row">
            <div class="c-item" onclick="festejoMordo()"><img src="mordecai.png" loading="lazy"></div>
            <div class="c-item" onclick="retoHuevo()"><img src="rigby.png" loading="lazy"></div>
            <div class="c-item" onclick="enojarBenson()"><img src="benson.png" loading="lazy"></div>
            <div class="c-item" onclick="sabiduriaSkips()"><img src="skips.png" loading="lazy"></div>
            <div class="c-item" onclick="regaloPapaleta()"><img src="papaleta.png" loading="lazy"></div>
            <div class="c-item" onclick="bromaMusculoso()"><img src="musculoso.png" loading="lazy"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        ELPARQUE26 - 2026
    </footer>

    <!-- SCRIPT -->
    <script>

    function buscarTemporada() {
        let input = document.getElementById('inputBuscador').value.toLowerCase();
        let posters = document.querySelectorAll('.poster-card');
        
        posters.forEach(p => {
            let nombre = p.getAttribute('data-name').toLowerCase();

            if (nombre.includes(input)) {
                p.style.display = "";
            } else {
                p.style.display = "none";
            }
        });
    }

    function mostrarMensaje(texto, imagen = null) {
        const m = document.createElement(imagen ? "img" : "div");

        if (imagen) {
            m.src = imagen;
        } else {
            m.innerText = texto;
        }

        m.className = "efecto-pop";
        document.body.appendChild(m);

        setTimeout(() => m.remove(), 2500);
    }

    function resetUI() {
        const t = document.getElementById('main-title');

        document.body.style.backgroundColor = "#0a0b10";
        document.body.style.filter = "none";
        document.body.classList.remove("shake-effect");

        t.innerText = "Un Show Más";
    }

    function enojarBenson() {
        const t = document.getElementById('main-title');

        document.body.style.backgroundColor = "#ff4757";
        t.innerText = "¡VUELVAN A TRABAJAR!";

        setTimeout(resetUI, 2000);
    }

    function retoHuevo() {
        const t = document.getElementById('main-title');

        document.body.style.backgroundColor = "#ffd32a";
        t.innerText = "¡SÉ EXTRA HUEVO ORDINARIO!";

        mostrarMensaje(null, "gorra.png");

        setTimeout(resetUI, 3000);
    }

    function festejoMordo() {
        const t = document.getElementById('main-title');

        document.body.style.backgroundColor = "#1e90ff";
        t.innerText = "¡OOOOOOOOOOH!";

        setTimeout(resetUI, 1500);
    }

    function sabiduriaSkips() {
        const t = document.getElementById('main-title');

        document.body.style.filter = "grayscale(1)";
        t.innerText = "YA HE VISTO ESTO ANTES...";

        setTimeout(resetUI, 2500);
    }

    function regaloPapaleta() {
        const t = document.getElementById('main-title');

        document.body.style.backgroundColor = "#ff79ff";
        t.innerText = "¡QUÉ BUEN SHOW!";

        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                const paleta = document.createElement("div");
                paleta.className = "paleta-caida";
                paleta.innerText = "🍭";
                paleta.style.left = Math.random() * 100 + "vw";
                paleta.style.animationDuration = (Math.random() * 2 + 1) + "s";

                document.body.appendChild(paleta);

                setTimeout(() => paleta.remove(), 3000);
            }, i * 100);
        }

        setTimeout(resetUI, 3000);
    }

    function bromaMusculoso() {
        const t = document.getElementById('main-title');

        document.body.classList.add("shake-effect");
        t.innerText = "¿SABEN QUIÉN MÁS?";

        mostrarMensaje("¡MI MAMI!");

        setTimeout(resetUI, 3500);
    }

    </script>

</body>
</html>
