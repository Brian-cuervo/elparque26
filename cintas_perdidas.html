<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Cintas Perdidas | ElParque26</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            margin: 0;
            background-color: #0a0b10;
            color: white;
            font-family: sans-serif;
        }

        /* ESTILO HBO MAX - EL BANNER GIGANTE */
        .hero-hbo {
            position: relative;
            width: 100%;
            height: 80vh; /* Ocupa el 80% de la pantalla */
            background: url('cintas_banner.webp') center/cover no-repeat;
            display: flex;
            align-items: flex-end; /* Tira el contenido para abajo */
        }

        /* Degradado oscuro para que el texto se lea perfecto */
        .hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #0a0b10 5%, rgba(10, 11, 16, 0.7) 40%, transparent 80%),
                        linear-gradient(to top, #0a0b10 2%, transparent 40%);
        }

        /* Contenedor del texto y botones */
        .hero-content-hbo {
            position: relative;
            z-index: 10;
            padding: 0 5% 50px 5%;
            max-width: 800px;
        }

        .hero-title {
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .hero-meta {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 30px;
            line-height: 1.6;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }

        /* Botón de Reproducir estilo HBO */
        .btn-play-hbo {
            background-color: white;
            color: black;
            padding: 15px 40px;
            border-radius: 4px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-play-hbo:hover {
            background-color: #e0e0e0;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">El<span>Parque26</span></a>
        </div>
        <div class="nav-links">
            <a href="index.html">⬅ VOLVER AL INICIO</a>
        </div>
    </nav>

    <div class="hero-hbo">
        <div class="hero-gradient"></div>
        
        <div class="hero-content-hbo">
            <h1 class="hero-title">LAS CINTAS PERDIDAS</h1>
            
            <div class="hero-meta">
                <span>2015</span>
                <span style="border: 1px solid #ccc; padding: 2px 6px; border-radius: 3px;">TV-PG</span>
                <span>Miniserie Especial</span>
            </div>
            
            <p class="hero-desc">
                Seis cortos especiales originales. Mordecai y Rigby se meten en nuevos problemas en el parque. Descubrí estas aventuras inéditas y reviví el caos de siempre con el estilo de Un Show Más.
            </p>
            
            <button class="btn-play-hbo" onclick="alert('Acá iría el reproductor o el link al video!')">▶ REPRODUCIR</button>
        </div>
    </div>

</body>
</html>
