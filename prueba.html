<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELPARQUE26 | Premium Stream</title>
    <meta name="theme-color" content="#030305">
    
    <!-- Fuentes Premium (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- variables & RESET --- */
        :root {
            --hbo-violet: #6b2cf5;
            --hbo-violet-dark: #4a12a8;
            --hbo-glow: rgba(107, 44, 245, 0.6);
            --bg-deep: #030305;
            --bg-card: #141419;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --glass-bg: rgba(15, 15, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar Oculta pero funcional */
        ::-webkit-scrollbar { width: 0; height: 0; }
        ::-webkit-scrollbar-thumb { background: transparent; }

        /* --- NAVBAR FLOTANTE (GLASSMORPHISM) --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(3,3,5,0.9) 0%, rgba(3,3,5,0.4) 60%, transparent 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.3s;
        }

        .nav-left { display: flex; align-items: center; gap: 20px; }
        
        .menu-btn {
            background: none; border: none; cursor: pointer; color: white; font-size: 24px;
            transition: 0.3s;
        }
        .menu-btn:hover { color: var(--hbo-violet); text-shadow: 0 0 10px var(--hbo-violet); }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-decoration: none;
            color: white;
            text-transform: uppercase;
        }
        .logo span { color: var(--hbo-violet); }

        .nav-search {
            display: flex; align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid transparent;
            transition: var(--transition-smooth);
        }
        .nav-search:focus-within {
            border-color: var(--hbo-violet);
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 15px var(--hbo-glow);
        }
        .nav-search input {
            background: transparent; border: none; color: white;
            outline: none; font-size: 0.9rem; margin-left: 8px; width: 150px;
            font-family: 'Inter', sans-serif;
        }
        .nav-search i { color: var(--text-muted); }

        /* --- SIDEBAR (OFF-CANVAS) --- */
        .sidebar {
            position: fixed; top: 0; left: -320px;
            width: 300px; height: 100%;
            background: #0a0a0c;
            border-right: 1px solid var(--glass-border);
            z-index: 2000;
            padding: 80px 20px 20px;
            transition: var(--transition-smooth);
            box-shadow: 10px 0 40px rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        .sidebar.active { left: 0; }
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px); z-index: 1500;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar-item {
            display: block; padding: 15px 0;
            color: var(--text-muted); text-decoration: none;
            font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .sidebar-item:hover { color: white; padding-left: 10px; }
        .sidebar-sub { padding-left: 20px; font-size: 0.9rem; color: #666; display: none; }
        .sidebar-sub.active { display: block; animation: fadeIn 0.3s; }
        
        .sidebar-toggle {
            width: 100%; text-align: left; background: none; border: none;
            color: white; font-size: 1.1rem; padding: 15px 0;
            cursor: pointer; display: flex; justify-content: space-between;
        }

        /* --- HERO SECTION (CINEMATIC) --- */
        .hero-slider {
            position: relative;
            height: 85vh;
            width: 100%;
            overflow: hidden;
        }

        .slide {
            position: absolute; inset: 0;
            opacity: 0; transition: opacity 1s ease;
            background-size: cover; background-position: center;
        }
        .slide.active { opacity: 1; }
        
        /* Animación Ken Burns */
        .slide.active::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to right, #030305 0%, rgba(3,3,5,0.6) 50%, transparent 100%),
                        linear-gradient(to top, #030305 0%, transparent 40%);
            z-index: 2;
        }
        
        .slide.active img {
            animation: zoomEffect 20s infinite alternate;
            width: 100%; height: 100%; object-fit: cover;
        }

        @keyframes zoomEffect {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .hero-content {
            position: absolute; bottom: 15%; left: 4%;
            z-index: 10; max-width: 700px;
            transform: translateY(20px); opacity: 0;
            transition: all 0.8s ease-out 0.3s;
        }
        .slide.active .hero-content { transform: translateY(0); opacity: 1; }

        .badge {
            display: inline-block; padding: 6px 12px;
            background: rgba(107, 44, 245, 0.2);
            border: 1px solid var(--hbo-violet);
            color: #d8b4fe;
            font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; margin-bottom: 15px;
            backdrop-filter: blur(5px);
            border-radius: 4px;
        }
        
        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5rem; line-height: 0.9;
            margin-bottom: 15px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .hero-desc {
            font-size: 1.1rem; color: #e2e2e2;
            margin-bottom: 30px; line-height: 1.6;
            max-width: 600px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .btn-hbo {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 35px;
            background: var(--hbo-violet);
            color: white; text-decoration: none;
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; border-radius: 4px;
            transition: var(--transition-smooth);
            box-shadow: 0 0 20px var(--hbo-glow);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-hbo:hover {
            background: white; color: black;
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
            transform: scale(1.05);
        }

        /* --- CAROUSELS & SECTIONS --- */
        .section-title {
            padding: 0 4%; margin-bottom: 15px;
            font-size: 1.4rem; font-weight: 700;
            color: white; display: flex; align-items: center; gap: 10px;
        }
        .section-title::before {
            content: ''; width: 4px; height: 20px;
            background: var(--hbo-violet);
            border-radius: 2px; box-shadow: 0 0 10px var(--hbo-violet);
        }

        .carousel-container {
            position: relative;
            padding: 10px 0 40px 4%;
            margin-bottom: 20px;
        }
        
        .carousel-track {
            display: flex; gap: 20px;
            overflow-x: auto;
            padding: 20px 4% 20px 0;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        .carousel-track::-webkit-scrollbar { display: none; }

        .card {
            flex: 0 0 auto;
            width: 200px;
            height: 300px;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            transition: var(--transition-smooth);
            background: var(--bg-card);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: 0.5s;
        }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
            opacity: 0; transition: 0.3s;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 15px;
        }

        .card-title {
            font-size: 0.9rem; font-weight: 600;
            transform: translateY(10px); transition: 0.3s;
        }

        .card.playing .card-overlay, 
        .card:hover .card-overlay { opacity: 1; }
        .card:hover img { transform: scale(1.1); filter: brightness(0.6); }
        .card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 15px var(--hbo-violet-dark);
            z-index: 10;
        }
        .card:hover .card-title { transform: translateY(0); color: white; }

        .badge-new {
            position: absolute; top: 10px; left: 10px;
            background: #e50914; color: white;
            font-size: 0.65rem; font-weight: 800;
            padding: 4px 8px; border-radius: 3px;
            z-index: 5; letter-spacing: 0.5px;
        }

        /* --- CHARACTERS (MINIMALIST) --- */
        .char-row {
            display: flex; justify-content: center; gap: 30px;
            padding: 40px 0;
            background: linear-gradient(to bottom, transparent, rgba(107,44,245,0.05));
            margin-bottom: 20px;
        }
        .char-item {
            width: 60px; height: 60px; border-radius: 50%;
            overflow: hidden; cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
            filter: grayscale(0.8);
        }
        .char-item:hover {
            border-color: var(--hbo-violet);
            transform: scale(1.2);
            filter: grayscale(0);
            box-shadow: 0 0 20px var(--hbo-glow);
        }

        /* --- UTILS & FOOTER --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer {
            text-align: center; padding: 60px 0;
            color: #444; font-size: 0.8rem; letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- MODAL EASTER EGG --- */
        .egg-modal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0,0,
