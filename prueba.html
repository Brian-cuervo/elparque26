<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Owl House - Temporada 1 | ElParque26</title>
    <style>
        body {
            background-color: #0b0118; /* Violeta casi negro */
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .header-banner {
            width: 100%;
            height: 300px;
            background: url('banner_owl_house.jpg') no-repeat center center/cover;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .titulo-serie {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 24px;
            border: 1px solid #9d4edd;
        }

        .grid-episodios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .card-episodio {
            background: #1a0933;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #3c096c;
            transition: 0.3s;
        }

        .card-episodio:hover {
            border-color: #9d4edd;
            transform: scale(1.05);
        }

        .miniatura {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            cursor: pointer;
        }

        .info-cap {
            padding: 8px;
            font-size: 14px;
        }

        .btn-ver {
            display: block;
            background: #7b2cbf;
            color: white;
            text-decoration: none;
            padding: 5px;
            margin-top: 5px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Estilo para el reproductor */
        .reproductor-container {
            margin-top: 20px;
            padding: 10px;
        }

        iframe {
            width: 90%;
            max-width: 800px;
            height: 450px;
            border: 2px solid #9d4edd;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <div class="titulo-serie">The Owl House - Temporada 1</div>
    </div>

    <div class="reproductor-container" id="reproductor">
        <p>Selecciona un capítulo para empezar a ver</p>
    </div>

    <div class="grid-episodios">
        <div class="card-episodio">
            <img src="oht1c1.jpg" class="miniatura" onclick="cambiarVideo('ID_DE_DRIVE_CAP_1')">
            <div class="info-cap">
                <span>Capítulo 1</span>
                <a href="#reproductor" class="btn-ver" onclick="cambiarVideo('ID_DE_DRIVE_CAP_1')">VER AHORA</a>
            </div>
        </div>

        <div class="card-episodio">
            <img src="oht1c2.jpg" class="miniatura" onclick="cambiarVideo('ID_DE_DRIVE_CAP_2')">
            <div class="info-cap">
                <span>Capítulo 2</span>
                <a href="#reproductor" class="btn-ver" onclick="cambiarVideo('ID_DE_DRIVE_CAP_2')">VER AHORA</a>
            </div>
        </div>

        <div class="card-episodio">
            <img src="oht1c19.jpg" class="miniatura" onclick="cambiarVideo('ID_DE_DRIVE_CAP_19')">
            <div class="info-cap">
                <span>Capítulo 19</span>
                <a href="#reproductor" class="btn-ver" onclick="cambiarVideo('ID_DE_DRIVE_CAP_19')">VER AHORA</a>
            </div>
        </div>
    </div>

    <script>
        function cambiarVideo(id) {
            const contenedor = document.getElementById('reproductor');
            contenedor.innerHTML = `<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay"></iframe>`;
        }
    </script>

</body>
</html>
