<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background: black; color: white; text-align: center; font-family: sans-serif; padding: 50px;">

    <h2>Prueba de Fuego: Dragon Ball Z</h2>
    
    <video id="video" controls autoplay style="width: 100%; max-width: 800px; border: 3px solid #00c3ff; border-radius: 10px;"></video>

    <script>
        var video = document.getElementById('video');
        var hls = new Hls();
        
        // Link de Dragon Ball Z de tu nueva lista
        var url = 'https://jmp2.uk/plu-68e8fd7c3ede4398bc69af93.m3u8'; 

        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => console.log("Dale play manual"));
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
