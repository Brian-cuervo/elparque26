<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un Show Más Latino | ElParque26</title>

<style>
:root {
    --azul: #00c3ff;
}

body {
    margin: 0;
    background: #0a0b10;
    color: white;
    font-family: sans-serif;
}

/* NAV */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 5%;
    position: fixed;
    width: 90%;
    z-index: 100;
}

.logo {
    font-weight: bold;
    font-size: 1.5rem;
}

.logo span {
    color: var(--azul);
}

/* HERO */
.hero {
    height: 80vh;
    background: url('banner_generico_usm.jpg') center/cover;
    display: flex;
    align-items: flex-end;
}

.hero-content {
    padding: 40px 5%;
    max-width: 600px;
}

.hero h1 {
    font-size: 3rem;
    margin: 0;
}

.hero p {
    color: #ccc;
}

.btn {
    background: white;
    color: black;
    padding: 10px 25px;
    font-weight: bold;
    border-radius: 5px;
    display: inline-block;
    margin-top: 15px;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* BUSCADOR */
.search {
    display: flex;
    justify-content: center;
    margin: 20px;
}

.search input {
    width: 80%;
    max-width: 400px;
    padding: 12px;
    border-radius: 25px;
    border: none;
}

/* GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}

.card {
    width: 160px;
    height: 240px;
    overflow: hidden;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: 0.3s;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card:hover {
    transform: translateY(-8px) scale(1.05);
}

.card:hover img {
    filter: brightness(0.5);
}

/* BOTÓN CARD */
.card-btn {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--azul);
    color: black;
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 0.8rem;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 30px;
    color: #555;
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">El<span>Parque26</span></div>
</nav>

<header class="hero">
    <div class="hero-content">
        <h1>UN SHOW MÁS</h1>
        <p>Mordecai y Rigby en una locura total.</p>
        <a href="t1.html" class="btn">▶ Ver Temporada 1</a>
    </div>
</header>

<div class="search">
    <input type="text" id="buscador" placeholder="Buscar temporada...">
</div>

<section class="grid" id="grid">

<a href="t1.html" class="card" data-name="temporada 1">
    <img src="t1.png">
    <div class="card-btn">Ver T1</div>
</a>

<a href="t2.html" class="card" data-name="temporada 2">
    <img src="t2.png">
    <div class="card-btn">Ver T2</div>
</a>

<a href="t3.html" class="card" data-name="temporada 3">
    <img src="t3.png">
    <div class="card-btn">Ver T3</div>
</a>

<a href="t4.html" class="card" data-name="temporada 4">
    <img src="t4.png">
    <div class="card-btn">Ver T4</div>
</a>

<a href="t5.html" class="card" data-name="temporada 5">
    <img src="t5.png">
    <div class="card-btn">Ver T5</div>
</a>

<a href="t6.html" class="card" data-name="temporada 6">
    <img src="t6.png">
    <div class="card-btn">Ver T6</div>
</a>

<a href="t7.html" class="card" data-name="temporada 7">
    <img src="t7.png">
    <div class="card-btn">Ver T7</div>
</a>

<a href="t8.html" class="card" data-name="temporada 8">
    <img src="t8.png">
    <div class="card-btn">Ver T8</div>
</a>

<a href="pelicula.html" class="card" data-name="pelicula">
    <img src="pelicula.png">
    <div class="card-btn">Ver Película</div>
</a>

</section>

<footer>
ELPARQUE26 - 2026
</footer>

<script>
const input = document.getElementById("buscador");
const cards = document.querySelectorAll(".card");

input.addEventListener("keyup", () => {
    const texto = input.value.toLowerCase();

    cards.forEach(card => {
        const nombre = card.getAttribute("data-name");

        if(nombre.includes(texto)) {
            card.style.display = "";
        } else {
            card.style.display = "none";
        }
    });
});
</script>

</body>
</html>
