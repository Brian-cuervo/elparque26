<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben 10 - Película | ElParque26</title>
    <style>
        :root {
            --verde-ben: #a2ff00;
            --negro-fondo: #050505;
            --gris-tarjeta: #121212;
            --celeste-logo: #00d4ff;
            --naranja-peli: #ffaa00; /* Color especial para la peli */
        }
        body {
            margin: 0;
            background-color: var(--negro-fondo);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- NAVBAR OFICIAL ELPARQUE26 --- */
        .navbar {
            background-color: var(--negro-fondo);
            width: 100%;
            padding: 20px 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .logo-nav {
            font-size: 1.5rem;
            font-weight: 900;
            color: white;
            text-decoration: none;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 1px;
        }
        .logo-nav span { 
            color: var(--celeste-logo); 
        }
        .btn-volver-nav {
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn-volver-nav:hover {
            color: gray;
        }

        /* --- HEADER PELÍCULA --- */
        .header-peli {
            text-align: center;
            padding: 30px;
            border-bottom: 2px solid var(--naranja-peli);
            background-color: #1a1100;
        }
        .header-peli h1 { 
            color: var(--naranja-peli); 
            margin: 0; 
            font-size: 2.2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }

        /* --- TARJETA DE LA PELI --- */
        .container { max-width: 1200px; margin: 60px auto; padding: 0 20px; display: flex; justify-content: center; }
        
        .card-peli {
            background-color: var(--gris-tarjeta);
            border-radius: 10px;
            padding: 30px;
            border: 2px solid var(--naranja-peli);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.2);
        }
        .card-peli h3 { color: white; font-size: 1.3rem; margin-top: 0; margin-bottom: 20px; }
        
        .btn-ver {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            background-color: var(--naranja-peli);
            color: black;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }
        .btn-ver:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
        }

        /* --- REPRODUCTOR (MODAL) --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9); 
            backdrop-filter: blur(5px);
        }
        .modal-content {
            position: relative;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            width: 95%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            border: 2px solid var(--naranja-peli); /* Borde naranja para el reproductor */
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
            border-radius: 10px;
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
        .cerrar {
            position: absolute;
            top: -40px;
            right: 0;
            color: var(--naranja-peli);
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .cerrar:hover {
            color: white;
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            .navbar { padding: 15px 20px; }
            .logo-nav { font-size: 1.2rem; }
            .btn-volver-nav { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR OFICIAL -->
    <nav class="navbar">
        <a href="index.html" class="logo-nav">EL<span>PARQUE</span>26</a>
        <a href="ben10.html" class="btn-volver-nav">← VOLVER A TEMPORADAS</a>
    </nav>

    <!-- ENCABEZADO -->
    <div class="header-peli">
        <h1>PELÍCULA</h1>
    </div>

    <!-- TARJETA ÚNICA -->
    <div class="container">
        <div class="card-peli">
            <h3>El Secreto del Omnitrix</h3>
            <button onclick="abrirModal('1TNyt5tJE1Wlv0Jx8-NYVcE_cVtZU_-y1')" class="btn-ver">▶ VER PELÍCULA</button>
        </div>
    </div>

    <!-- EL REPRODUCTOR OCULTO -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="cerrar" onclick="cerrarModal()">×</span>
            <iframe id="videoFrame" src="" allow="autoplay" allowfullscreen></iframe>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        function abrirModal(idVideo) {
            document.getElementById('videoFrame').src = "https://drive.google.com/file/d/" + idVideo + "/preview";
            document.getElementById('videoModal').style.display = "block";
        }

        function cerrarModal() {
            document.getElementById('videoModal').style.display = "none";
            document.getElementById('videoFrame').src = "";
        }
    </script>

</body>
</html>
