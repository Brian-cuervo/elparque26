<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Personaje - Un Show Más</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
        }

        .interfaz {
            position: relative;
            width: 100vw;
            max-width: 1200px;
            aspect-ratio: 16 / 9; 
            background-image: url('fondo_seleccion.png');
            background-size: 100% 100%; 
            background-repeat: no-repeat;
            background-position: center;
        }

        /* RENDERS MOVIDOS HACIA ARRIBA (Al marco del parque) */
        .render {
            position: absolute;
            bottom: 42%; /* Antes estaba en 22%, ahora subió a las pantallas */
            height: 40%; 
            max-width: 22%; 
            object-fit: contain;
            object-position: bottom center; 
            z-index: 1;
            transition: all 0.2s ease-in-out;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
            pointer-events: none;
        }

        #render-p1 { left: 5%; }
        #render-p2 { right: 5%; transform: scaleX(-1); } 

        .grilla-iconos {
            position: absolute;
            top: 29%; 
            left: 50%;
            transform: translateX(-50%);
            width: 40%; 
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1.5%; 
            z-index: 10;
        }

        .icono-personaje {
            width: 100%;
            aspect-ratio: 1 / 1; 
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, border-color 0.2s;
        }

        .icono-personaje:hover {
            transform: scale(1.1);
            border-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .boton-aleatorio {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 8%;
            height: 12%;
            cursor: pointer;
            z-index: 20;
        }

        .nombre-container {
            position: absolute;
            bottom: 6%;
            width: 25%;
            text-align: center;
            z-index: 5;
        }

        #nombre-p1-container { left: 4%; }
        #nombre-p2-container { right: 4%; }

        .nombre-label {
            font-size: clamp(14px, 2.5vw, 32px); 
            color: white;
            text-shadow: 2px 2px #000;
            font-weight: bold;
            text-transform: uppercase;
            font-style: italic;
        }

        /* --- NUEVO: BOTONES DE "LISTO" --- */
        .boton-listo {
            position: absolute;
            bottom: 18%; /* Altura de las cajas de "LISTO" en la imagen */
            width: 22%;
            height: 10%;
            cursor: pointer;
            z-index: 20;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        #btn-listo-p1 { left: 4.5%; }
        /* La máquina no tiene cursor pointer porque se activa sola */
        #btn-listo-p2 { right: 4.5%; cursor: default; } 

        /* Clases de Neón que se activan con JavaScript */
        .listo-blue {
            box-shadow: 0 0 20px #00d4ff, inset 0 0 15px #00d4ff;
            background-color: rgba(0, 212, 255, 0.2);
            border: 2px solid #00d4ff;
        }

        .listo-red {
            box-shadow: 0 0 20px #ff0000, inset 0 0 15px #ff0000;
            background-color: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
        }
    </style>
</head>
<body>

    <div class="interfaz">
        <img id="render-p1" class="render" src="render_mordecai.png">
        <img id="render-p2" class="render" src="render_rigby.png">

        <div class="nombre-container" id="nombre-p1-container">
            <div class="nombre-label" id="nombre-p1">MORDECAI</div>
        </div>
        <div class="nombre-container" id="nombre-p2-container">
            <div class="nombre-label" id="nombre-p2">RIGBY</div>
        </div>

        <div id="btn-listo-p1" class="boton-listo" onclick="confirmarPelea()"></div>
        <div id="btn-listo-p2" class="boton-listo"></div>

        <div class="grilla-iconos">
            <img src="icon_mordecai.png" class="icono-personaje" onclick="elegir('mordecai')">
            <img src="icon_rigby.png" class="icono-personaje" onclick="elegir('rigby')">
            <img src="icon_benson.png" class="icono-personaje" onclick="elegir('benson')">
            <img src="icon_skips.png" class="icono-personaje" onclick="elegir('skips')">
            <img src="icon_musculoso.png" class="icono-personaje" onclick="elegir('musculoso')">
            <img src="icon_fantasmin.png" class="icono-personaje" onclick="elegir('fantasmin')">
            <img src="icon_papaleta.png" class="icono-personaje" onclick="elegir('papaleta')">
            <img src="icon_la_muerte.png" class="icono-personaje" onclick="elegir('la_muerte')">
        </div>

        <div class="boton-aleatorio" onclick="elegirAleatorio()"></div>
    </div>

    <script>
        const personajes = ['mordecai', 'rigby', 'benson', 'skips', 'musculoso', 'fantasmin', 'papaleta', 'la_muerte'];
        let peleaConfirmada = false;

        function elegir(personaje) {
            if(peleaConfirmada) return; // Si ya le diste a LISTO, no te deja cambiar
            
            document.getElementById('render-p1').src = `render_${personaje}.png`;
            document.getElementById('nombre-p1').innerText = personaje.replace('_', ' ');
            eleccionMaquina();
        }

        function eleccionMaquina() {
            const indiceAzar = Math.floor(Math.random() * personajes.length);
            const personajeMaquina = personajes[indiceAzar];
            document.getElementById('render-p2').src = `render_${personajeMaquina}.png`;
            document.getElementById('nombre-p2').innerText = personajeMaquina.replace('_', ' ');
        }

        function elegirAleatorio() {
            if(peleaConfirmada) return;
            const indiceAzarP1 = Math.floor(Math.random() * personajes.length);
            elegir(personajes[indiceAzarP1]);
        }

        // Lógica para los botones de LISTO
        function confirmarPelea() {
            if (!peleaConfirmada) {
                peleaConfirmada = true; // Bloquea la selección de personajes
                
                // Prende el neón azul del jugador 1
                document.getElementById('btn-listo-p1').classList.add('listo-blue');
                
                // Efecto dramático: La máquina espera 0.8 segundos y da el OK con rojo
                setTimeout(() => {
                    document.getElementById('btn-listo-p2').classList.add('listo-red');
                    
                    // Acá avisa que arranca. ¡Después lo cambiamos para que cargue el nivel!
                    setTimeout(() => alert('¡PREPARADOS PARA LA PELEA!'), 600);
                }, 800);
            }
        }
    </script>

</body>
</html>
