<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Personaje - Un Show Más</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }

        /* Contenedor principal adaptable */
        .interfaz {
            position: relative;
            width: 100vw;
            max-width: 1200px;
            aspect-ratio: 1200 / 800; /* Mantiene la proporción de tu imagen de fondo */
            background-image: url('fondo_seleccion.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Renders de personajes */
        .render {
            position: absolute;
            bottom: 20%;
            height: 50%;
            object-fit: contain;
            z-index: 1;
            transition: all 0.3s ease;
            pointer-events: none; /* Para que no molesten al hacer clic en los iconos */
        }

        #render-p1 { left: 5%; }
        #render-p2 { right: 5%; transform: scaleX(-1); } /* Espeja al P2 para que mire al P1 */

        /* Grilla de iconos con porcentajes para que no se mueva de los cuadritos */
        .grilla-iconos {
            position: absolute;
            top: 29%; 
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(4, 9vw); /* Tamaño relativo al ancho de pantalla */
            grid-template-rows: repeat(2, 9vw);
            gap: 1vw;
            z-index: 10;
        }

        .icono-personaje {
            width: 100%;
            height: 100%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.1s, border-color 0.2s;
        }

        .icono-personaje:hover {
            transform: scale(1.1);
            border-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        /* Nombres */
        .nombre-container {
            position: absolute;
            bottom: 10%;
            width: 25%;
            text-align: center;
            z-index: 5;
        }

        #nombre-p1-container { left: 5%; }
        #nombre-p2-container { right: 5%; }

        .nombre-label {
            font-size: clamp(14px, 4vw, 32px); /* Tamaño de fuente adaptable */
            color: white;
            text-shadow: 2px 2px #000;
            font-weight: bold;
            text-transform: uppercase;
            font-style: italic;
        }

        /* AJUSTES ESPECÍFICOS PARA CELULARES (Pantallas verticales o chicas) */
        @media (max-width: 768px) {
            .interfaz {
                width: 100%;
                aspect-ratio: auto;
                height: 100vh;
                background-size: cover;
            }

            .grilla-iconos {
                grid-template-columns: repeat(4, 18vw); /* Iconos más grandes en el celu */
                grid-template-rows: repeat(2, 18vw);
                top: 35%;
            }

            .render {
                height: 35%;
                bottom: 5%;
            }

            #render-p1 { left: 2%; }
            #render-p2 { right: 2%; }
        }
    </style>
</head>
<body>

    <div class="interfaz">
        <img id="render-p1" class="render" src="render_mordecai.png">
        <img id="render-p2" class="render" src="render_rigby.png">

        <div class="nombre-container" id="nombre-p1-container">
            <div class="nombre-label" id="nombre-p1">MORDECAI</div>
        </div>
        <div class="nombre-container" id="nombre-p2-container">
            <div class="nombre-label" id="nombre-p2">RIGBY</div>
        </div>

        <div class="grilla-iconos">
            <img src="icon_mordecai.png" class="icono-personaje" onclick="elegir('mordecai')">
            <img src="icon_rigby.png" class="icono-personaje" onclick="elegir('rigby')">
            <img src="icon_benson.png" class="icono-personaje" onclick="elegir('benson')">
            <img src="icon_skips.png" class="icono-personaje" onclick="elegir('skips')">
            <img src="icon_musculoso.png" class="icono-personaje" onclick="elegir('musculoso')">
            <img src="icon_fantasmin.png" class="icono-personaje" onclick="elegir('fantasmin')">
            <img src="icon_papaleta.png" class="icono-personaje" onclick="elegir('papaleta')">
            <img src="icon_la_muerte.png" class="icono-personaje" onclick="elegir('la_muerte')">
        </div>
    </div>

    <script>
        let turno = 1;

        function elegir(personaje) {
            if (turno === 1) {
                document.getElementById('render-p1').src = `render_${personaje}.png`;
                document.getElementById('nombre-p1').innerText = personaje.replace('_', ' ');
                turno = 2; // Ahora le toca elegir al P2
            } else {
                document.getElementById('render-p2').src = `render_${personaje}.png`;
                document.getElementById('nombre-p2').innerText = personaje.replace('_', ' ');
                turno = 1; // Vuelve el turno al P1
            }
        }
    </script>

</body>
</html>
