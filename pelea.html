<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Regular Show - Ultimate Fight</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        
        #game-stage {
            width: 100vw; height: 100vh;
            background-size: cover; background-position: bottom;
            position: relative; overflow: hidden;
        }

        .pj {
            position: absolute; bottom: 100px;
            width: 150px; image-rendering: pixelated;
            z-index: 10; transition: transform 0.1s;
        }

        .hud {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: space-around; padding: 0 10px; z-index: 100;
        }
        .bar-container { width: 45%; height: 30px; background: rgba(0,0,0,0.6); border: 3px solid #fff; position: relative; }
        .hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.2s, background-color 0.2s; }
        .name-label { position: absolute; top: -20px; color: white; font-size: 12px; text-shadow: 2px 2px #000; }

        #fight-screen, #win-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4); z-index: 200; flex-direction: column;
        }
        #win-screen { display: none; background: rgba(0,0,0,0.8); color: yellow; font-size: 40px; text-transform: uppercase; text-shadow: 3px 3px red; }
        #fight-logo { width: 280px; animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes bounceIn { from { transform: scale(0); } to { transform: scale(1); } }

        #controls {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px; z-index: 150;
        }
        .d-pad { position: relative; width: 120px; height: 120px; }
        .btn-dir {
            position: absolute; width: 50px; height: 50px;
            background: rgba(255,255,255,0.2); border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center; color: white;
        }
        #left { top: 35px; left: 0; border-radius: 10px 0 0 10px; }
        #right { top: 35px; right: 0; border-radius: 0 10px 10px 0; }

        .actions { display: flex; gap: 20px; align-items: center; }
        .btn-action {
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px; border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #btn-a { background: #e74c3c; } 
        #btn-b { background: #3498db; }

        .smoke, .hit-fx { position: absolute; z-index: 15; image-rendering: pixelated; }
        .smoke { width: 40px; opacity: 0.6; animation: smokeOut 0.5s forwards; }
        .hit-fx { width: 80px; animation: hitPop 0.2s forwards; }
        @keyframes smokeOut { to { transform: translateY(-20px) scale(1.5); opacity: 0; } }
        @keyframes hitPop { 0% { transform: scale(0.5); } 50% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 0; } }
    </style>
</head>
<body>

<div id="game-stage">
    <div id="fight-screen"><img id="fight-logo" src="fight_logo.png"></div>
    <div id="win-screen"><span id="win-text"></span></div>

    <div class="hud">
        <div class="bar-container">
            <span class="name-label">MORDECAI</span>
            <div id="hp-morde" class="hp-fill"></div>
        </div>
        <div class="bar-container">
            <span class="name-label" style="right:0">RIGBY</span>
            <div id="hp-rigby" class="hp-fill" style="float:right"></div>
        </div>
    </div>

    <img id="mordecai" class="pj" src="mordecai_pose.png">
    <img id="rigby" class="pj" src="rigby_pose.png" style="transform: scaleX(-1);">

    <div id="controls">
        <div class="d-pad">
            <div class="btn-dir" id="left">←</div>
            <div class="btn-dir" id="right">→</div>
        </div>
        <div class="actions">
            <div class="btn-action" id="btn-a">A</div>
            <div class="btn-action" id="btn-b">B</div>
        </div>
    </div>
</div>

<script>
    const fondos = ['fondo_parque.png', 'fondo_casa.png', 'fondo_espacio.png'];
    const stage = document.getElementById('game-stage');
    stage.style.backgroundImage = `url('${fondos[Math.floor(Math.random() * fondos.length)]}')`;

    setTimeout(() => {
        document.getElementById('fight-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('fight-screen').style.display = 'none', 500);
        startGame();
    }, 1500);

    const morde = document.getElementById('mordecai');
    const rigby = document.getElementById('rigby');
    const hpMordeBar = document.getElementById('hp-morde');
    const hpRigbyBar = document.getElementById('hp-rigby');

    let mordeX = window.innerWidth * 0.15;
    let rigbyX = window.innerWidth * 0.70;
    let mordeHp = 100, rigbyHp = 100;
    let mordeAttacking = false, rigbyAttacking = false;
    let gameOver = false;
    let walkFrame = 1;

    // Posiciones iniciales
    morde.style.left = mordeX + 'px';
    rigby.style.left = rigbyX + 'px';

    function spawnEffect(type, x, y) {
        const fx = document.createElement('img');
        fx.src = type === 'smoke' ? 'efecto_humo.png' : 'efecto_golpe.png';
        fx.className = type === 'smoke' ? 'smoke' : 'hit-fx';
        fx.style.left = x + 'px';
        fx.style.bottom = y + 'px';
        stage.appendChild(fx);
        setTimeout(() => fx.remove(), type === 'smoke' ? 500 : 200);
    }

    function checkCollision() {
        return Math.abs(mordeX - rigbyX) < 140; // Distancia de impacto
    }

    function updateBars() {
        hpMordeBar.style.width = mordeHp + '%';
        hpRigbyBar.style.width = rigbyHp + '%';
        if (mordeHp < 30) hpMordeBar.style.background = 'red';
        if (rigbyHp < 30) hpRigbyBar.style.background = 'red';
    }

    function endGame(winner) {
        gameOver = true;
        document.getElementById('win-screen').style.display = 'flex';
        document.getElementById('win-text').innerText = winner + " WINS!";
        
        if (winner === 'MORDECAI') {
            morde.src = 'mordecai_ganar_2.png';
            rigby.src = 'rigby_dolor.png';
        } else {
            rigby.src = 'rigby_ganar_2.png';
            morde.src = 'mordecai_dolor.png';
        }
    }

    // --- LÓGICA DE MORDECAI (JUGADOR) ---
    function moveMorde(dir) {
        if (mordeAttacking || gameOver) return;
        mordeX += (dir === 'right' ? 20 : -20);
        if (mordeX < 0) mordeX = 0;
        if (mordeX > window.innerWidth - 100) mordeX = window.innerWidth - 100;

        morde.style.left = mordeX + 'px';
        morde.style.transform = dir === 'left' ? 'scaleX(-1)' : 'scaleX(1)';
        walkFrame = walkFrame === 1 ? 2 : 1;
        morde.src = `mordecai_caminar_${walkFrame}.png`;
        spawnEffect('smoke', mordeX + 40, 100);
    }

    function attackMorde(type) {
        if (mordeAttacking || gameOver) return;
        mordeAttacking = true;
        morde.src = type === 'A' ? 'mordecai_ataque.png' : 'mordecai_ataque_fuerte.png';
        
        if (checkCollision() && !rigbyAttacking) {
            rigbyHp -= (type === 'A' ? 10 : 15);
            rigby.src = 'rigby_dolor.png';
            spawnEffect('hit', rigbyX, 150);
            updateBars();
            if (rigbyHp <= 0) { endGame('MORDECAI'); return; }
        }
        
        setTimeout(() => {
            if (!gameOver) morde.src = 'mordecai_pose.png';
            mordeAttacking = false;
        }, 350);
    }

    // --- LÓGICA DE RIGBY (IA BÁSICA) ---
    function rigbyAI() {
        if (gameOver) return;
        
        const distance = mordeX - rigbyX;
        rigby.style.transform = distance < 0 ? 'scaleX(-1)' : 'scaleX(1)'; // Mirar a Morde

        if (Math.abs(distance) > 130) {
            // Acercarse
            rigbyX += distance > 0 ? 15 : -15;
            rigby.style.left = rigbyX + 'px';
            rigby.src = `rigby_caminar_${walkFrame}.png`;
        } else {
            // Atacar
            if (!rigbyAttacking && Math.random() > 0.5) {
                rigbyAttacking = true;
                rigby.src = 'rigby_ataque.png';
                if (!mordeAttacking) {
                    mordeHp -= 10;
                    morde.src = 'mordecai_dolor.png';
                    spawnEffect('hit', mordeX + 50, 150);
                    updateBars();
                    if (mordeHp <= 0) { endGame('RIGBY'); return; }
                }
                setTimeout(() => {
                    if (!gameOver) rigby.src = 'rigby_pose.png';
                    rigbyAttacking = false;
                }, 400);
            }
        }
        
        if (!rigbyAttacking && !gameOver) {
            setTimeout(() => { rigby.src = 'rigby_pose.png'; }, 200);
        }
    }

    function startGame() {
        setInterval(rigbyAI, 800); // Rigby piensa cada 0.8 segundos
    }

    // Controles
    document.getElementById('left').addEventListener('touchstart', (e) => { e.preventDefault(); moveMorde('left'); });
    document.getElementById('right').addEventListener('touchstart', (e) => { e.preventDefault(); moveMorde('right'); });
    document.getElementById('btn-a').addEventListener('touchstart', (e) => { e.preventDefault(); attackMorde('A'); });
    document.getElementById('btn-b').addEventListener('touchstart', (e) => { e.preventDefault(); attackMorde('B'); });

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'a') moveMorde('left');
        if (e.key.toLowerCase() === 'd') moveMorde('right');
        if (e.key.toLowerCase() === 'j') attackMorde('A');
        if (e.key.toLowerCase() === 'k') attackMorde('B');
    });

    window.addEventListener('keyup', () => {
        if (!mordeAttacking && !gameOver) morde.src = 'mordecai_pose.png';
    });
</script>

</body>
</html>
