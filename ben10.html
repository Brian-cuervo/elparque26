<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben 10 Clásico | Temporadas | ElParque26</title>
    <style>
        :root {
            --verde-ben: #a2ff00;
            --negro-fondo: #050505;
            --gris-tarjeta: #121212;
        }
        body {
            margin: 0;
            background-color: var(--negro-fondo);
            color: white;
            font-family: sans-serif;
        }
        .hero-ben {
            height: 50vh;
            background: linear-gradient(to top, var(--negro-fondo), transparent), 
                        url('banner_ben10.png') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 30px;
            border-bottom: 3px solid var(--verde-ben);
        }
        .hero-ben h1 {
            color: var(--verde-ben);
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--verde-ben);
        }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .grid-temporadas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .btn-temporada {
            background-color: var(--gris-tarjeta);
            border: 2px solid #333;
            color: white;
            padding: 30px 20px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-temporada:hover {
            border-color: var(--verde-ben);
            color: var(--verde-ben);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(162, 255, 0, 0.2);
        }
        .btn-peli { border-color: #ffaa00; color: #ffaa00; }
        .btn-peli:hover { color: #ffaa00; border-color: #ffaa00; box-shadow: 0 0 20px rgba(255, 170, 0, 0.3); }
        .volver { display: inline-block; margin-top: 20px; color: gray; text-decoration: none; }
    </style>
</head>
<body>

    <header class="hero-ben">
        <h1>BEN 10</h1>
        <p>SELECCIONÁ UNA TEMPORADA</p>
    </header>

    <div class="container">
        <a href="index.html" class="volver">← Volver al Inicio</a>
        
        <div class="grid-temporadas">
            <a href="ben10t1.html" class="btn-temporada">Temporada 1</a>
            <a href="#" class="btn-temporada">Temporada 2</a>
            <a href="#" class="btn-temporada">Temporada 3</a>
            <a href="#" class="btn-temporada">Temporada 4</a>
            <a href="#" class="btn-temporada btn-peli">Película: El Secreto del Omnitrix</a>
        </div>
    </div>

</body>
</html>
