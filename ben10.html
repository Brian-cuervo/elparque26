<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben 10 Clásico | Temporadas | ElParque26</title>
    <style>
        :root {
            --verde-ben: #a2ff00;
            --negro-fondo: #050505;
            --gris-tarjeta: #121212;
        }
        body {
            margin: 0;
            background-color: var(--negro-fondo);
            color: white;
            font-family: sans-serif;
        }

        /* --- NAVBAR --- */
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo-nav {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            letter-spacing: 2px;
        }
        .logo-nav span { color: var(--verde-ben); }
        .btn-volver-nav {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 20px;
            border-radius: 20px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-volver-nav:hover {
            border-color: var(--verde-ben);
            color: var(--verde-ben);
            background-color: rgba(162, 255, 0, 0.1);
        }

        /* --- HEADER --- */
        .hero-ben {
            height: 50vh;
            background: linear-gradient(to top, var(--negro-fondo), transparent), 
                        url('banner_ben10.png') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 30px;
            border-bottom: 3px solid var(--verde-ben);
        }
        .hero-ben p {
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
            color: white;
            margin: 0;
        }

        /* --- GRILLA --- */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .grid-temporadas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }
        .btn-temporada {
            background-color: var(--gris-tarjeta);
            border: 2px solid #333;
            color: white;
            padding: 30px 20px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-temporada:hover {
            border-color: var(--verde-ben);
            color: var(--verde-ben);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(162, 255, 0, 0.2);
        }
        .btn-peli { border-color: #ffaa00; color: #ffaa00; }
        .btn-peli:hover { color: #ffaa00; border-color: #ffaa00; box-shadow: 0 0 20px rgba(255, 170, 0, 0.3); }
        
        @media (max-width: 600px) {
            .navbar { padding: 15px 20px; }
            .logo-nav { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo-nav">ELPARQUE<span>26</span></a>
        <a href="index.html" class="btn-volver-nav">Volver al Inicio</a>
    </nav>

    <header class="hero-ben">
        <p>SELECCIONÁ UNA TEMPORADA</p>
    </header>

    <div class="container">
        <div class="grid-temporadas">
            <a href="ben10t1.html" class="btn-temporada">Temporada 1</a>
            <a href="ben10t2.html" class="btn-temporada">Temporada 2</a>
            <a href="ben10t3.html" class="btn-temporada">Temporada 3</a>
            <a href="ben10t4.html" class="btn-temporada">Temporada 4</a>
            <a href="ben10peli.html" class="btn-temporada btn-peli">Película: El Secreto del Omnitrix</a>
        </div>
    </div>

</body>
</html>
