<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Show Más: La Película | ElParque26</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Importamos fuentes copadas para la peli */
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@400;700&display=swap');

        .titulo-peli {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: #ffd32a; /* Amarillo */
            text-shadow: 3px 3px 0px #ff4757, 6px 6px 0px rgba(0,0,0,0.6); /* Sombra roja y negra 3D */
            letter-spacing: 3px;
            margin: 0;
        }

        /* Ajuste del header */
        .hero-peli {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), #0a0b10);
        }

        /* --- NUEVO: ESTILOS PARA LOS POCHOCLOS --- */
        .pochoclos-container {
            text-align: center;
            font-size: 4rem; /* Bien grandes */
            margin-top: 10px;
            margin-bottom: -15px; /* Los acerca al reproductor */
            filter: drop-shadow(0px 0px 10px rgba(255, 211, 42, 0.5)); /* Brillo amarillo */
            animation: flotar 3s ease-in-out infinite; /* Animación de flote */
        }

        /* Animación suave de flote */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- FIN ESTILOS POCHOCLOS --- */

        .subtitulo-peli {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            color: #1e90ff; /* Azul Mordecai */
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .desc-peli {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            color: #ccc;
            max-width: 600px; 
            margin: 0 auto;
            line-height: 1.6;
        }
    </style>
</head>

        🍿🥤🍿🥤
    </div>

            Mordecai y Rigby viajan en el tiempo para salvar el universo y su amistad de un entrenador de voleibol loco. ¡Preparate para la batalla más épica de sus vidas!
