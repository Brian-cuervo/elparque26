<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Película | Un Show Más | ElParque26</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            margin: 0;
            background-color: #0a0b10;
            color: white;
            font-family: sans-serif;
        }

        /* --- ESTILO HBO MAX - EL BANNER GIGANTE --- */
        .hero-hbo {
            position: relative;
            width: 100%;
            height: 70vh;
            background: url('banner_generico_usm.jpg') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
        }

        .hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #0a0b10 10%, rgba(10, 11, 16, 0.8) 30%, transparent 80%),
                        linear-gradient(to top, #0a0b10 5%, transparent 40%);
        }

        .hero-content-hbo {
            position: relative;
            z-index: 10;
            padding: 0 5% 40px 5%;
            max-width: 700px;
        }

        .hero-title {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .hero-meta {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap; /* Para que no se corte en celulares */
        }

        .dato-curioso {
            color: #00c3ff; /* Celeste ElParque26 */
            border-left: 2px solid #00c3ff;
            padding-left: 8px;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 25px;
            line-height: 1.5;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }

        .btn-play-hbo {
            background-color: white;
            color: black;
            padding: 12px 35px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-play-hbo:hover {
            background-color: #e0e0e0;
            transform: scale(1.05);
        }

        /* --- REPRODUCTOR --- */
        .video-section {
            padding: 40px 5% 100px 5%;
            background-color: #0a0b10;
            display: flex;
            justify-content: center;
        }

        .video-wrapper {
            width: 100%;
            max-width: 900px;
            display: none;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 500px; /* Altura ideal para Drive */
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">El<span>Parque26</span></a>
        </div>
        <div class="nav-links">
            <a href="index.html">⬅ VOLVER AL INICIO</a>
        </div>
    </nav>

    <div class="hero-hbo">
        <div class="hero-gradient"></div>
        <div class="hero-content-hbo">
            <h1 class="hero-title">LA PELÍCULA</h1>
            <div class="hero-meta">
                <span>2015</span>
                <span style="border: 1px solid #ccc; padding: 2px 6px; border-radius: 3px;">Película</span>
                <span>1h 8m</span>
                <span class="dato-curioso">🍿 Cronología: Transcurre entre la Temporada 6 y 7</span>
            </div>
            <p class="hero-desc">
                Mordecai y Rigby viajan en el tiempo para salvar el universo y su amistad de un entrenador de voleibol loco. ¡Preparate para la batalla más épica de sus vidas!
            </p>
            <button class="btn-play-hbo" onclick="VerVideo('https://drive.google.com/file/d/1qOmSnwkqGjdbODXS9HGB7RwmuDn-b9Kj/preview')">▶ VER PELÍCULA</button>
        </div>
    </div>

    <section class="video-section">
        <div class="video-wrapper" id="contenedor-video">
            <iframe id="video-frame" src="" allowfullscreen></iframe>
        </div>
    </section>

    <script>
        function VerVideo(link) {
            let linkFinal = link;
            if (linkFinal.includes('/view')) {
                linkFinal = linkFinal.substring(0, linkFinal.indexOf('/view')) + '/preview';
            }

            const frame = document.getElementById('video-frame');
            const contenedor = document.getElementById('contenedor-video');
            
            frame.src = linkFinal;
            contenedor.style.display = "block"; // Muestra el reproductor
            
            // Hace scroll suave hasta el reproductor
            contenedor.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
